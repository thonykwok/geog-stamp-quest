<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台管理 | Geog Stamp Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }

    .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.08); }

<body class="bg-gradient-to-br from-slate-100 via-amber-50 to-slate-100 min-h-screen">

  <div id="login-screen" class="fixed inset-0 flex items-center justify-center bg-slate-900/95 backdrop-blur">
    <div class="bg-white rounded-3xl p-10 shadow-2xl max-w-sm w-full mx-4 text-center">
      <div class="text-4xl mb-3">🗺️</div>
      <h1 class="text-2xl font-bold text-slate-800 mb-1">Geog Stamp Quest</h1>
      <p class="text-slate-500 text-sm mb-8">後台管理 · 請用學校電郵登入</p>
      <button id="btn-login" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3.5 rounded-2xl w-full flex items-center justify-center gap-2 shadow-lg shadow-blue-200 transition">
        <i class="fab fa-google"></i> 用 Google 登入
      </button>
      <p id="login-error" class="text-red-500 text-sm mt-4 hidden"></p>
    </div>
  </div>

  <div id="admin-panel" class="hidden max-w-3xl mx-auto px-4 py-8">
    <div class="flex justify-between items-start mb-8 flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">後台管理</h1>
        <p class="text-sm text-slate-500 mt-1">登入：<span id="user-email" class="text-slate-700"></span></p>
      </div>
      <div class="flex gap-4 items-center text-sm">
        <a href="index.html" class="text-sky-600 hover:text-sky-700 font-medium">← 返回遊戲</a>
        <button id="btn-logout" class="text-red-500 hover:text-red-600">登出</button>
      </div>
    </div>

    <div id="status" class="mb-4 text-sm text-slate-600 min-h-[1.25rem]"></div>

    <section class="card bg-white rounded-2xl border border-amber-100 p-6 mb-6 shadow-sm">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">⚙️</span>
        <h2 class="font-bold text-lg text-amber-800">遊戲設定（前台所有文字）</h2>
      </div>
      <div class="grid sm:grid-cols-2 gap-4 text-sm">
        <div><label class="block text-slate-500 mb-1 font-medium">中文名稱</label>
          <input id="set-title" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="長洲地理明信片"></div>
        <div><label class="block text-slate-500 mb-1 font-medium">英文副標題</label>
          <input id="set-subtitle" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="cheung chau geog postcard"></div>
        <div class="sm:col-span-2"><label class="block text-slate-500 mb-1 font-medium">開頭說明</label>
          <input id="set-description" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="第一身視角探索..."></div>
        <div><label class="block text-slate-500 mb-1 font-medium">Emoji</label>
          <input id="set-emoji" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="🏝️"></div>
        <div><label class="block text-slate-500 mb-1 font-medium">開始按鈕</label>
          <input id="set-startBtn" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="開始冒險"></div>
        <div class="sm:col-span-2"><label class="block text-slate-500 mb-1 font-medium">開頭頁底部提示</label>
          <input id="set-footerHint" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="真正 Google 街景 360°..."></div>
        <div><label class="block text-slate-500 mb-1 font-medium">明信片按鈕</label>
          <input id="set-postcardBtn" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="明信片"></div>
        <div><label class="block text-slate-500 mb-1 font-medium">上一站</label>
          <input id="set-prevBtn" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="上一站"></div>
        <div><label class="block text-slate-500 mb-1 font-medium">下一站</label>
          <input id="set-nextBtn" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="下一站"></div>
        <div><label class="block text-slate-500 mb-1 font-medium">開始任務</label>
          <input id="set-quizBtn" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="開始任務"></div>
        <div><label class="block text-slate-500 mb-1 font-medium">已完成</label>
          <input id="set-quizDone" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="已完成"></div>
        <div><label class="block text-slate-500 mb-1 font-medium">進度格式（用 {i} 同 {total}）</label>
          <input id="set-progressFormat" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="第 {i} / {total} 站"></div>
        <div><label class="block text-slate-500 mb-1 font-medium">景點地圖標題</label>
          <input id="set-mapTitle" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="景點地圖"></div>
        <div class="sm:col-span-2"><label class="block text-slate-500 mb-1 font-medium">明信片剩餘提示（用 {n}）</label>
          <input id="set-postcardRemain" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="還有 {n} 個印等你收集！"></div>
        <div class="sm:col-span-2"><label class="block text-slate-500 mb-1 font-medium">通關標題（用 {n}）</label>
          <input id="set-endingTitle" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="恭喜集齊 {n} 個印！"></div>
        <div class="sm:col-span-2"><label class="block text-slate-500 mb-1 font-medium">通關說明</label>
          <input id="set-endingDesc" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="你已經完成探索！..."></div>
        <div><label class="block text-slate-500 mb-1 font-medium">再玩一次</label>
          <input id="set-replayBtn" class="w-full border border-slate-200 rounded-xl px-3 py-2" placeholder="再玩一次"></div>
      </div>
      <button id="btn-save-settings" class="mt-5 bg-amber-500 hover:bg-amber-400 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-sm transition">
        <i class="fas fa-save mr-1.5"></i>儲存設定
      </button>
    </section>

    <div class="flex flex-wrap gap-3 mb-4 items-center justify-between">
      <h2 class="font-bold text-slate-700 flex items-center gap-2"><span>📍</span> 景點列表</h2>
      <div class="flex gap-2">
        <button id="btn-add-loc" class="bg-sky-500 hover:bg-sky-400 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm">
          <i class="fas fa-plus mr-1"></i>新增
        </button>
        <button id="btn-save-all" class="bg-emerald-500 hover:bg-emerald-400 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm">
          <i class="fas fa-save mr-1"></i>儲存全部
        </button>
      </div>
    </div>
    <p class="text-xs text-slate-400 mb-4">可用 ↑↓ 調次序。可貼 Google 街景網址自動填座標。前台進度永遠顯示「第 X / 總數 站」。</p>
    <div id="locations-list" class="space-y-4"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBgoiufpYsPF4EsqOCqVQWbg9RWLRhCltc",
      authDomain: "cheung-chau-quest.firebaseapp.com",
      projectId: "cheung-chau-quest",
      storageBucket: "cheung-chau-quest.firebasestorage.app",
      messagingSenderId: "1093724794704",
      appId: "1:1093724794704:web:5aae4cdf6921644a9ac655"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const EXTRA_ALLOWED = ["thony.kwok.ai@gmail.com"];
    function isAllowedEmail(email) {
      email = (email || "").toLowerCase();
      if (email.endsWith("@caritasfsc.edu.hk")) return true;
      return EXTRA_ALLOWED.map(e => e.toLowerCase()).includes(email);
    }

    let currentData = [];

    /** 解析 Google 街景 / Maps URL */
    function parseStreetViewUrl(url) {
      if (!url || typeof url !== 'string') return null;
      url = url.trim();
      let lat, lng, heading, pitch, fov;

      // @lat,lng,3a,FOVy,HEADh,PITCHt
      let m = url.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*),3a,(\d+\.?\d*)y,(\d+\.?\d*)h,(-?\d+\.?\d*)t/i);
      if (m) {
        lat = parseFloat(m[1]); lng = parseFloat(m[2]);
        fov = parseFloat(m[3]); heading = parseFloat(m[4]); pitch = parseFloat(m[5]);
      }
      // @lat,lng,zoom or @lat,lng
      if (lat === undefined) {
        m = url.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);
        if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
      }
      // !3dLAT!4dLNG
      if (lat === undefined) {
        m = url.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/);
        if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
      }
      // q=lat,lng
      if (lat === undefined) {
        m = url.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
        if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
      }
      // heading in data: !6m... or cbll=
      if (heading === undefined) {
        m = url.match(/[?&]cbp=\d+,(\d+\.?\d*)/);
        if (m) heading = parseFloat(m[1]);
      }
      if (lat === undefined || lng === undefined || isNaN(lat) || isNaN(lng)) return null;

      // FOV ~75 對應 zoom≈1；粗略換算
      let zoom = 1;
      if (fov !== undefined && !isNaN(fov)) {
        if (fov >= 100) zoom = 0;
        else if (fov >= 70) zoom = 1;
        else if (fov >= 50) zoom = 1.5;
        else if (fov >= 30) zoom = 2;
        else zoom = 2.5;
      }
      return {
        lat, lng,
        heading: heading !== undefined && !isNaN(heading) ? heading : 0,
        pitch: pitch !== undefined && !isNaN(pitch) ? pitch : 0,
        zoom
      };
    }

    document.getElementById('btn-login').onclick = () => {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
        document.getElementById('login-error').textContent = err.message;
        document.getElementById('login-error').classList.remove('hidden');
      });
    };
    document.getElementById('btn-logout').onclick = () => auth.signOut();

    auth.onAuthStateChanged(user => {
      if (user) {
        if (!isAllowedEmail(user.email)) {
          document.getElementById('login-error').textContent = '未獲授權（需 @caritasfsc.edu.hk）';
          document.getElementById('login-error').classList.remove('hidden');
          auth.signOut();
          return;
        }
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        document.getElementById('user-email').textContent = user.email;
        loadSettings();
        loadData();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('admin-panel').classList.add('hidden');
      }
    });

    const SET_KEYS = ['title','subtitle','description','emoji','startBtn','footerHint','postcardBtn','prevBtn','nextBtn','quizBtn','quizDone','progressFormat','mapTitle','postcardRemain','endingTitle','endingDesc','replayBtn'];

    async function loadSettings() {
      try {
        const doc = await db.collection('config').doc('settings').get();
        if (doc.exists) {
          const s = doc.data();
          SET_KEYS.forEach(k => {
            const el = document.getElementById('set-' + k);
            if (el) el.value = s[k] || '';
          });
        }
      } catch (e) {}
    }

    document.getElementById('btn-save-settings').onclick = async () => {
      const status = document.getElementById('status');
      status.textContent = '儲存設定中...';
      try {
        const data = {};
        SET_KEYS.forEach(k => {
          const el = document.getElementById('set-' + k);
          data[k] = el ? el.value.trim() : '';
        });
        if (!data.title) data.title = '地理明信片';
        if (!data.subtitle) data.subtitle = 'Geog Stamp Quest';
        if (!data.emoji) data.emoji = '🏝️';
        if (!data.progressFormat) data.progressFormat = '第 {i} / {total} 站';
        await db.collection('config').doc('settings').set(data, { merge: true });
        status.innerHTML = '<span class="text-emerald-600">✅ 遊戲設定已儲存</span>';
      } catch (e) {
        status.textContent = '失敗：' + e.message;
      }
    };

    async function loadData() {
      const status = document.getElementById('status');
      status.textContent = '載入中...';
      try {
        const snap = await db.collection('locations').orderBy('order').get();
        currentData = snap.empty ? [] : snap.docs.map(d => {
          const data = d.data();
          if (!data.quizzes && data.quizQ) {
            data.quizzes = [{ title: data.quizTitle || '', q: data.quizQ, options: data.options || [], answer: data.answer ?? 0 }];
          }
          if (!data.quizzes) data.quizzes = [];
          if (data.zoom === undefined || data.zoom === null) data.zoom = 1;
          return { id: d.id, ...data };
        });
        status.textContent = currentData.length ? `已載入 ${currentData.length} 個景點` : '暫無景點，請新增';
        renderList();
      } catch (e) {
        status.textContent = '載入失敗：' + e.message;
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
    }

    function renderList() {
      const container = document.getElementById('locations-list');
      if (!currentData.length) {
        container.innerHTML = '<div class="text-center text-slate-400 py-12 bg-white rounded-2xl border border-dashed">尚未有景點</div>';
        return;
      }
      container.innerHTML = currentData.map((loc, i) => {
        const quizzesHtml = (loc.quizzes || []).map((qz, qi) => {
          const opts = (qz.options && qz.options.length) ? qz.options : ['', '', '', ''];
          const optsHtml = opts.map((opt, oi) => `
            <div class="flex items-center gap-2 mb-1.5" data-oi="${oi}">
              <span class="text-xs font-bold text-amber-700 bg-amber-100 w-6 h-6 rounded-full flex items-center justify-center shrink-0">${oi}</span>
              <input class="flex-1 border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm" data-opt="${oi}" value="${escapeHtml(opt)}" placeholder="選項 ${oi}">
              <button type="button" class="text-red-400 text-xs shrink-0" onclick="removeOption(${i},${qi},${oi})" title="刪除此選項"><i class="fas fa-times"></i></button>
            </div>`).join('');
          return `
          <div class="bg-slate-50 rounded-xl p-3 mb-2 border border-slate-100" data-qi="${qi}">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-semibold text-slate-400">問題 ${qi + 1}</span>
              <button type="button" class="text-red-400 hover:text-red-600 text-xs" onclick="removeQuiz(${i},${qi})"><i class="fas fa-trash"></i></button>
            </div>
            <input class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 mb-1.5 text-sm" data-qfield="title" placeholder="任務標題" value="${escapeHtml(qz.title)}">
            <input class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 mb-2 text-sm" data-qfield="q" placeholder="問題內容" value="${escapeHtml(qz.q)}">
            <div class="text-xs font-medium text-slate-500 mb-1">選項（編號 = 正確答案要填嘅數字）</div>
            <div class="options-list mb-2">${optsHtml}</div>
            <button type="button" class="text-sky-500 text-xs mb-2" onclick="addOption(${i},${qi})"><i class="fas fa-plus mr-1"></i>加一個選項</button>
            <div class="flex items-center gap-2">
              <label class="text-xs text-slate-500">正確答案編號</label>
              <input type="number" min="0" max="${Math.max(opts.length - 1, 0)}" class="w-20 border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm" data-qfield="answer" value="${qz.answer ?? 0}">
              <span class="text-xs text-slate-400">（0 = 第一個）</span>
            </div>
          </div>`;
        }).join('');

        return `
        <div class="card bg-white rounded-2xl border border-slate-100 p-5 shadow-sm" data-index="${i}">
          <div class="flex justify-between items-center mb-4 gap-2 flex-wrap">
            <div class="flex items-center gap-2">
              <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">#${i + 1}</span>
              <h3 class="font-bold text-slate-800">景點 ${i + 1}</h3>
            </div>
            <div class="flex items-center gap-1">
              <button type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 disabled:opacity-30" ${i===0?'disabled':''} onclick="moveLoc(${i},-1)"><i class="fas fa-arrow-up"></i></button>
              <button type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 disabled:opacity-30" ${i===currentData.length-1?'disabled':''} onclick="moveLoc(${i},1)"><i class="fas fa-arrow-down"></i></button>
              <button type="button" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-500 ml-1" onclick="removeLoc(${i})"><i class="fas fa-trash"></i></button>
            </div>
          </div>
          <div class="grid sm:grid-cols-2 gap-3 text-sm mb-4">
            <div class="sm:col-span-2"><label class="block text-slate-400 text-xs mb-1">Google 街景網址（貼上後自動填座標）</label>
              <div class="flex gap-2">
                <input class="flex-1 border border-slate-200 rounded-xl px-3 py-2" data-field="streetUrl" placeholder="https://www.google.com/maps/@22.20,114.02,3a,..." value="">
                <button type="button" class="bg-sky-500 hover:bg-sky-400 text-white px-3 py-2 rounded-xl text-xs shrink-0" onclick="applyStreetUrl(${i})">套用</button>
              </div>
              <p class="text-xs text-slate-400 mt-1">支援常見 Google Maps / 街景分享連結</p>
            </div>
            <div><label class="block text-slate-400 text-xs mb-1">名稱</label>
              <input class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="name" value="${escapeHtml(loc.name)}"></div>
            <div><label class="block text-slate-400 text-xs mb-1">副標題（選填，唔影響「第X/Y站」）</label>
              <input class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="sub" value="${escapeHtml(loc.sub)}"></div>
            <div class="sm:col-span-2"><label class="block text-slate-400 text-xs mb-1">描述</label>
              <textarea class="w-full border border-slate-200 rounded-xl px-3 py-2" rows="2" data-field="desc">${escapeHtml(loc.desc)}</textarea></div>
            <div><label class="block text-slate-400 text-xs mb-1">緯度 lat</label>
              <input type="number" step="any" class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="lat" value="${loc.lat ?? ''}"></div>
            <div><label class="block text-slate-400 text-xs mb-1">經度 lng</label>
              <input type="number" step="any" class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="lng" value="${loc.lng ?? ''}"></div>
            <div><label class="block text-slate-400 text-xs mb-1">朝向 heading (0–360)</label>
              <input type="number" class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="heading" value="${loc.heading || 0}"></div>
            <div><label class="block text-slate-400 text-xs mb-1">俯仰 pitch</label>
              <input type="number" class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="pitch" value="${loc.pitch || 0}"></div>
            <div><label class="block text-slate-400 text-xs mb-1">視野 zoom（0最廣，建議 0–3）</label>
              <input type="number" step="0.1" min="0" max="5" class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="zoom" value="${loc.zoom ?? 1}"></div>
            <div><label class="block text-slate-400 text-xs mb-1">印章 emoji</label>
              <input class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="stampEmoji" value="${escapeHtml(loc.stampEmoji)}"></div>
            <div><label class="block text-slate-400 text-xs mb-1">印章名稱</label>
              <input class="w-full border border-slate-200 rounded-xl px-3 py-2" data-field="stampName" value="${escapeHtml(loc.stampName)}"></div>
          </div>
          <div class="border-t border-slate-100 pt-3">
            <div class="flex justify-between items-center mb-2">
              <span class="text-sm font-medium text-slate-600">問題</span>
              <button type="button" class="text-sky-500 hover:text-sky-600 text-sm font-medium" onclick="addQuiz(${i})"><i class="fas fa-plus mr-1"></i>新增問題</button>
            </div>
            <div class="quizzes-container">${quizzesHtml || '<p class="text-sm text-slate-300 py-2">暫無問題</p>'}</div>
          </div>
        </div>`;
      }).join('');
    }

    window.applyStreetUrl = function(i) {
      collectFromDom();
      const card = document.querySelector(`#locations-list > div[data-index="${i}"]`);
      if (!card) return;
      const input = card.querySelector('[data-field="streetUrl"]');
      const url = input ? input.value : '';
      const parsed = parseStreetViewUrl(url);
      if (!parsed) {
        alert('未能從呢個網址讀取座標。請確認係 Google Maps / 街景分享連結。');
        return;
      }
      currentData[i].lat = parsed.lat;
      currentData[i].lng = parsed.lng;
      currentData[i].heading = parsed.heading;
      currentData[i].pitch = parsed.pitch;
      currentData[i].zoom = parsed.zoom;
      renderList();
      document.getElementById('status').innerHTML =
        `<span class="text-emerald-600">✅ 已套用：lat ${parsed.lat}, lng ${parsed.lng}, heading ${parsed.heading}, pitch ${parsed.pitch}, zoom ${parsed.zoom}</span>`;
    };

    window.moveLoc = function(i, dir) {
      collectFromDom();
      const j = i + dir;
      if (j < 0 || j >= currentData.length) return;
      const tmp = currentData[i];
      currentData[i] = currentData[j];
      currentData[j] = tmp;
      renderList();
    };

    window.addQuiz = function(i) {
      collectFromDom();
      if (!currentData[i].quizzes) currentData[i].quizzes = [];
      currentData[i].quizzes.push({ title: '', q: '', options: ['選項A','選項B','選項C','選項D'], answer: 0 });
      renderList();
    };
    window.removeQuiz = function(i, qi) {
      collectFromDom();
      currentData[i].quizzes.splice(qi, 1);
      renderList();
    };
    window.addOption = function(i, qi) {
      collectFromDom();
      if (!currentData[i].quizzes[qi].options) currentData[i].quizzes[qi].options = [];
      currentData[i].quizzes[qi].options.push('');
      renderList();
    };
    window.removeOption = function(i, qi, oi) {
      collectFromDom();
      const opts = currentData[i].quizzes[qi].options || [];
      if (opts.length <= 2) { alert('至少保留 2 個選項'); return; }
      opts.splice(oi, 1);
      // 若正確答案 index 超出，調返
      if (currentData[i].quizzes[qi].answer >= opts.length) {
        currentData[i].quizzes[qi].answer = opts.length - 1;
      }
      renderList();
    };
    window.removeLoc = function(i) {
      if (!confirm('確定刪除呢個景點？')) return;
      collectFromDom();
      currentData.splice(i, 1);
      renderList();
    };

    document.getElementById('btn-add-loc').onclick = () => {
      collectFromDom();
      currentData.push({
        name: '新景點', sub: '', desc: '',
        lat: 22.20, lng: 114.03, heading: 0, pitch: 0, zoom: 1,
        stampEmoji: '📍', stampName: '新景點',
        quizzes: [{ title: '任務', q: '問題？', options: ['A','B','C','D'], answer: 0 }]
      });
      renderList();
    };

    function collectFromDom() {
      document.querySelectorAll('#locations-list > div[data-index]').forEach((card, i) => {
        if (!currentData[i]) return;
        const get = f => { const el = card.querySelector(`[data-field="${f}"]`); return el ? el.value : ''; };
        currentData[i].name = get('name');
        currentData[i].sub = get('sub');
        currentData[i].desc = get('desc');
        currentData[i].lat = parseFloat(get('lat')) || 0;
        currentData[i].lng = parseFloat(get('lng')) || 0;
        currentData[i].heading = parseFloat(get('heading')) || 0;
        currentData[i].pitch = parseFloat(get('pitch')) || 0;
        currentData[i].zoom = parseFloat(get('zoom'));
        if (isNaN(currentData[i].zoom)) currentData[i].zoom = 1;
        currentData[i].stampEmoji = get('stampEmoji');
        currentData[i].stampName = get('stampName');
        currentData[i].quizzes = [];
        card.querySelectorAll('.quizzes-container > div[data-qi]').forEach(block => {
          const getQ = f => { const el = block.querySelector(`[data-qfield="${f}"]`); return el ? el.value : ''; };
          const options = [];
          block.querySelectorAll('.options-list input[data-opt]').forEach(inp => {
            options.push(inp.value);
          });
          currentData[i].quizzes.push({
            title: getQ('title'),
            q: getQ('q'),
            options: options.length ? options : ['A','B','C','D'],
            answer: parseInt(getQ('answer')) || 0
          });
        });
      });
    }

    document.getElementById('btn-save-all').onclick = async () => {
      collectFromDom();
      const status = document.getElementById('status');
      status.textContent = '儲存中...';
      try {
        const old = await db.collection('locations').get();
        const batch = db.batch();
        old.docs.forEach(d => batch.delete(d.ref));
        currentData.forEach((loc, i) => {
          batch.set(db.collection('locations').doc('loc' + i), {
            order: i,
            name: loc.name,
            sub: loc.sub || '',
            desc: loc.desc,
            lat: loc.lat, lng: loc.lng,
            heading: loc.heading, pitch: loc.pitch,
            zoom: loc.zoom ?? 1,
            stampEmoji: loc.stampEmoji, stampName: loc.stampName,
            quizzes: loc.quizzes || []
          });
        });
        await batch.commit();
        status.innerHTML = `<span class="text-emerald-600">✅ 已儲存 ${currentData.length} 個景點</span>`;
        loadData();
      } catch (e) {
        status.textContent = '儲存失敗：' + e.message;
      }
    };
  </script>
</body>
</html>
