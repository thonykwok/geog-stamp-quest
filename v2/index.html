<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 | Geog Stamp Quest v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-900 via-blue-900 to-slate-900 text-white flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center">
    <div class="text-5xl mb-4">🗺️</div>
    <h1 class="text-3xl font-bold mb-2">Geog Stamp Quest</h1>
    <p class="text-sky-200 mb-1">老師專用平台 · v2</p>
    <p class="text-slate-400 text-sm mb-8">用 Google 帳號登入，管理你的地理探索程式</p>

    <div id="login-box" class="bg-white/10 backdrop-blur rounded-2xl p-8 border border-white/20">
      <button id="btn-login" class="w-full bg-white text-slate-800 font-semibold py-3.5 px-6 rounded-xl hover:bg-sky-50 transition flex items-center justify-center gap-3 shadow-lg">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" class="w-5 h-5" />
        使用 Google 登入
      </button>
      <p id="status" class="mt-4 text-sm text-slate-300"></p>
    </div>

    <p class="mt-8 text-xs text-slate-500">
      學生遊玩唔使登入 · 用老師提供嘅專屬連結即可<br/>
      <a href="../" class="text-sky-400 hover:underline">返回 v1 公開版</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const status = document.getElementById('status');
    const provider = new firebase.auth.GoogleAuthProvider();

    firebase.auth().onAuthStateChanged(async (user) => {
      if (user) {
        status.textContent = '已登入，前往控制台…';
        // Ensure user doc
        try {
          await firebase.firestore().collection('users').doc(user.uid).set({
            email: user.email,
            displayName: user.displayName || '',
            photoURL: user.photoURL || '',
            lastLogin: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        } catch (e) { console.warn(e); }
        location.href = 'dashboard.html';
      }
    });

    document.getElementById('btn-login').onclick = async () => {
      status.textContent = '登入中…';
      try {
        await firebase.auth().signInWithPopup(provider);
      } catch (e) {
        status.textContent = '登入失敗：' + e.message;
      }
    };
  </script>
</body>
</html>
