<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>地理明信片</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; margin: 0; }
    .stamp { transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .stamp.collected { transform: scale(1.1) rotate(-8deg); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
    .postcard { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%); border: 8px solid #92400e; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
    .quiz-card { animation: slideUp 0.4s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes barSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @keyframes borderFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    .progress-dot.active { background: #f59e0b; transform: scale(1.3); }
    .progress-dot.done { background: #10b981; }
    #map-container { flex: 1 1 auto; min-height: 58vh; height: 58vh; position: relative; background: #0f172a; }
    #pano { width: 100%; height: 100%; }
    #sv-loading {
      position: absolute; inset: 0; z-index: 25;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(15, 23, 42, 0.88); color: #e2e8f0; text-align: center; padding: 1.25rem;
    }
    #sv-loading.show { display: flex; }
    #sv-loading .spinner { display: none; }
    .sv-bar-track {
      width: min(260px, 70vw); height: 8px; border-radius: 999px;
      background: rgba(255,255,255,0.15); overflow: hidden; margin-bottom: 14px;
    }
    .sv-bar-fill {
      height: 100%; width: 40%; border-radius: 999px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b);
      animation: barSlide 1.2s ease-in-out infinite;
    }
    /* 流動光線邊框按鈕 */
    .btn-glow {
      position: relative;
      z-index: 1;
      border: none;
      isolation: isolate;
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.45);
    }
    .btn-glow::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f59e0b, #fde68a, #34d399, #38bdf8, #f59e0b);
      background-size: 300% 100%;
      animation: borderFlow 2.2s linear infinite;
      z-index: -2;
    }
    .btn-glow::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: inherit;
      z-index: -1;
    }
    .btn-glow-amber {
      background: #f59e0b;
      color: #0f172a;
      font-weight: 700;
    }
    .btn-glow-amber::after { background: #f59e0b; }
    .btn-glow-sky {
      background: #0ea5e9;
      color: #0f172a;
      font-weight: 700;
    }
    .btn-glow-sky::after { background: #0ea5e9; }
    .btn-done {
      background: #334155 !important;
      color: #94a3b8 !important;
      font-weight: 600;
      box-shadow: none;
      cursor: default;
    }
    .btn-done::before, .btn-done::after { display: none !important; }
    .btn-idle {
      background: rgba(0,0,0,0.7);
      color: #fff;
      box-shadow: none;
    }
    .btn-idle::before, .btn-idle::after { display: none !important; }
    #mini-map-wrap { position: absolute; bottom: 72px; left: 12px; z-index: 30; pointer-events: none; }
    #mini-map { width: 160px; height: 160px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.5); background: #e2e8f0; transition: width 0.25s ease, height 0.25s ease; pointer-events: auto; }
    #mini-map-wrap.expanded #mini-map { width: min(380px, 85vw); height: min(380px, 55vh); }
    #btn-mini-toggle { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 8px; background: rgba(15,23,42,0.85); color: white; border: 1px solid rgba(255,255,255,0.35); font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 40; pointer-events: auto; }
    #intro-modal { position: fixed; inset: 0; z-index: 60; background: #000; }
    #intro-shell { position: relative; width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; }
    #media-stage { position: absolute; inset: 0; background: #000; }
    #media-stage img, #media-stage iframe { width: 100%; height: 100%; object-fit: contain; border: 0; }
    #intro-controls { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent); pointer-events: none; }
    #intro-controls > * { pointer-events: auto; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen overflow-x-hidden">
  <div id="boot-error" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-slate-900 p-6 text-center">
    <div class="text-4xl mb-4">⚠️</div>
    <p id="boot-msg" class="text-slate-300 mb-4">載入失敗</p>
    <a href="index.html" class="text-sky-400 underline">老師登入</a>
  </div>

  <div id="landing" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-b from-sky-900 via-blue-900 to-slate-900 p-6 text-center">
    <div class="max-w-lg w-full py-6">
      <div class="text-6xl mb-4" id="landing-emoji">🏝️</div>
      <h1 id="landing-title" class="text-4xl font-bold mb-3">地理明信片</h1>
      <p id="landing-subtitle" class="text-xl text-sky-200 mb-2">Geog Stamp Quest</p>
      <p id="landing-desc" class="text-slate-300 mb-8">第一身視角探索，完成任務，集齊印章！</p>
      <button onclick="startGame()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold text-lg px-10 py-4 rounded-full shadow-lg">開始冒險 <i class="fas fa-arrow-right ml-2"></i></button>
    </div>
  </div>

  <div id="game" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-800/95 sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-slate-700">
      <div>
        <div id="loc-name" class="font-bold text-lg">載入中...</div>
        <div id="loc-sub" class="text-xs text-slate-400">第 1 站</div>
      </div>
      <button onclick="togglePostcard()" class="relative bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-full font-medium text-sm">
        <i class="fas fa-envelope-open-text"></i> 明信片
        <span id="stamp-count" class="absolute -top-1 -right-1 bg-red-500 text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </button>
    </header>
    <div class="bg-slate-800/50 px-4 py-2 flex justify-center gap-2" id="progress-dots"></div>
    <div id="map-container">
      <div id="pano"></div>
      <div id="sv-loading">
        <div class="spinner"></div>
        <div class="sv-bar-track" id="sv-bar-track">
          <div class="sv-bar-fill" id="sv-bar-fill"></div>
        </div>
        <div id="sv-loading-text" class="text-sm font-medium">載入街景中…</div>
        <div id="sv-loading-sub" class="text-xs text-slate-400 mt-1">首次載入可能需要幾秒</div>
      </div>
      <div id="mini-map-wrap">
        <button type="button" id="btn-mini-toggle"><i class="fas fa-expand" id="mini-toggle-icon"></i></button>
        <div id="mini-map"></div>
      </div>
      <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-3 px-4 z-10">
        <button onclick="prevLocation()" id="btn-prev" class="bg-black/70 text-white px-4 py-2.5 rounded-full text-sm disabled:opacity-30"><i class="fas fa-chevron-left"></i> 上一站</button>
        <button type="button" id="btn-quiz" onclick="startQuiz()" class="btn-glow btn-glow-amber px-5 py-2.5 rounded-full text-sm"><i class="fas fa-question-circle"></i> <span id="btn-quiz-label">開始任務</span></button>
        <button type="button" onclick="nextLocation()" id="btn-next" class="btn-idle px-4 py-2.5 rounded-full text-sm">下一站 <i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    <div class="bg-slate-800 p-4 border-t border-slate-700"><p id="loc-desc" class="text-slate-300 text-sm">載入中...</p></div>
  </div>

  <div id="intro-modal" class="hidden">
    <div id="intro-shell">
      <div id="media-stage"></div>
      <div id="intro-controls">
        <div id="intro-counter" class="text-sm text-white/80">1 / 1</div>
        <div class="flex gap-3">
          <button type="button" id="btn-intro-prev" class="bg-white/20 text-white px-5 py-2.5 rounded-full text-sm">前</button>
          <button type="button" id="btn-intro-enter" class="bg-amber-500 text-slate-900 font-bold px-6 py-2.5 rounded-full text-sm">進入景點</button>
          <button type="button" id="btn-intro-next" class="bg-white/20 text-white px-5 py-2.5 rounded-full text-sm">後</button>
        </div>
      </div>
    </div>
  </div>

  <div id="quiz-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
    <div class="quiz-card bg-slate-800 rounded-2xl max-w-md w-full p-6 border border-slate-600">
      <div class="flex justify-between mb-4">
        <h3 id="quiz-title" class="text-xl font-bold text-amber-400">任務</h3>
        <button onclick="closeQuiz()" class="text-slate-400"><i class="fas fa-times"></i></button>
      </div>
      <p id="quiz-q" class="text-lg mb-5"></p>
      <div id="quiz-options" class="space-y-3"></div>
      <div id="quiz-feedback" class="mt-4 hidden text-center font-medium"></div>
    </div>
  </div>

  <div id="postcard-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4">
    <div class="postcard rounded-xl max-w-sm w-full p-6 relative">
      <button onclick="togglePostcard()" class="absolute top-3 right-3 text-amber-900"><i class="fas fa-times"></i></button>
      <h3 id="postcard-title" class="text-center text-amber-900 font-bold text-xl mb-1">地理明信片</h3>
      <p class="text-center text-amber-800 text-sm mb-5">Geog Stamp Quest</p>
      <div class="grid grid-cols-3 gap-3 mb-4" id="stamp-grid"></div>
      <p class="text-center text-amber-900 text-sm">還有 <span id="remain">0</span> 個印等你收集！</p>
    </div>
  </div>

  <div id="ending" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-gradient-to-b from-amber-900 to-slate-900 p-6 text-center">
    <div class="text-6xl mb-4">🎉</div>
    <h2 class="text-3xl font-bold mb-3">恭喜集齊所有印！</h2>
    <button onclick="location.reload()" class="bg-white text-amber-900 font-bold px-8 py-3 rounded-full mt-4">再玩一次</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC1ISPgkY3BsV7RM3BD41tPvewUPdOUJps&callback=initPano&v=weekly" async defer></script>
  <script src="play.js?v=4"></script>
</body>
</html>
